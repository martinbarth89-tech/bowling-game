{{frame() | json}}


<div class="flex flex-col frame-border">
  @let firstRoll = frame().rolls?.[0];
  @let secondRoll = frame().rolls?.[1];
  @let thirdRoll = frame().rolls?.[2];
  <div class="flex flex-row justify-between w-full h-full">
    <div class="flex justify-center items-center w-1/3 h-1/3">{{firstRoll}}</div>
    <div
      class="flex justify-center items-center w-1/3 h-1/3 second-roll"
      [class.spare-background]="frame().rule === 'spare'"
      [class.strike-background]="frame().rule === 'strike'"
    >
      @if (frame().rule === 'default') {
        {{secondRoll}}
      }
    </div>
  </div>

  <!--<div>{{frame()?.sum}}</div>-->
</div>
