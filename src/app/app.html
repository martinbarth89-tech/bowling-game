<div class="flex flex-col gap-10 items-center">
  <h1>Bowling-Game</h1>

  <div class="flex flex-row gap-10 items-center">
    <mat-form-field class="example-full-width" [subscriptSizing]="'dynamic'">
      <mat-label>Pinanzahl von 0-10</mat-label>
      <input matInput type="number" [formControl]="rollInput">
    </mat-form-field>

    <button mat-flat-button [disabled]="rollInput.value === null" (click)="roll()">Roll</button>
    <button mat-flat-button (click)="frameService.resetGame()">Reset Game</button>
  </div>

  <app-scoreboard></app-scoreboard>
</div>
